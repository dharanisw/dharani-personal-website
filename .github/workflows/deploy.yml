name: Deploy to EC2 (Image Transfer)
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Docker
        uses: docker/setup-buildx-action@v2

      - name: Build image
        run: docker build -t dharanidev .

      - name: Save Docker image
        run: docker save dharanidev | gzip > dharanidev.tar.gz

      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "dharanidev.tar.gz"
          target: "~/deploy"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.8
        with: 
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/deploy
            
            docker stop dharanidev 2>/dev/null || true
            docker rm dharanidev 2>/dev/null || true
            
            gunzip -c dharanidev.tar.gz | docker load
            
            rm dharanidev.tar.gz
           
            docker run -d --name dharanidev -p 80:80 dharanidev
            
            docker image prune -f