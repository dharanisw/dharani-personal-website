name: Deploy to EC2
on :
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps: 
      - name: checkout code
        uses: actions/checkout@v3
      
      - name: setup docker
        uses: docker-setup-buildx-action@v2

      - name: build image
        run: docker build -t dharanidev .

      - name: deploy to EC2
        uses: appleboy/ssh-action@v0.1.8
        with: 
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker stop dharanidev || true
            docker rm dharanidev || true 

            mkdir -p ~/deploy
            docker save dharanidev | ssh -i ~/.ssh/github_actions_ec2.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "docker load"

            docker run -d --name dharanidev -p 80:80 dharanidev
